name: 'Deployment document'

on:
  workflow_call:
    inputs:
      version:
        description: 'Emulate version (require "v" prefix)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Emulate version (require "v" prefix)'
        required: true
        type: string

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@9ebf656952a20c45a5d66606f083ff34f58b8ce0 # v4.0.0
        with:
          aqua_version: v2.57.1
          policy_allow: 'true'
      - name: Configure venv
        run: |
          uv sync --frozen --no-dev
      - name: Build docs
        run: |
          task --yes docs:build-dirhtml
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "docs release ${{ inputs.version }}"
